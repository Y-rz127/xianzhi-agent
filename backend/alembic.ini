[alembic]
# migration scripts dir (relative to this ini)
script_location = migrations
# add backend/ to sys.path so `import app` works (run from backend/)
prepend_sys_path = .
# DSN is resolved by migrations/env.py from app settings (POSTGRES_CONNECTION_STRING / .env)
sqlalchemy.url =

# batch size limits when running batched offline migrations
batch_segment_size = 500

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S