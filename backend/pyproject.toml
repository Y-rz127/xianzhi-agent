[project]
name = "xianzhi-agent"
version = "0.1.0"
description = "先知 - 八字命理分析预测智能体"
# 项目约束：仅支持 Python 3.11 / 3.12（3.10 部分依赖缺失，3.13/3.14 存在兼容性问题）
requires-python = ">=3.11,<3.13"
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<0.5.0",
    "langchain-chroma>=1.0.0,<2.0.0",
    "langchain-postgres>=0.0.17,<0.1.0",
    "langchain-text-splitters>=0.2.0",
    "langgraph>=1.0.0,<2.0.0",
    "chromadb>=1.0.0,<2.0.0",
    "dashscope>=1.20.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "lunar-python>=1.3.4",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "loguru>=0.7.2",
    "mcp>=1.28.0",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.0",
    "reportlab>=4.0.0",
    "redis>=5.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
# 本地 embedding 回退（DashScope 不可用时使用 HuggingFace 模型）
local-embedding = ["sentence-transformers>=2.7.0"]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.7.0"]

[tool.ruff]
line-length = 110
target-version = "py311"
# alembic 自动生成的迁移文件不入 lint 范围：I001/W292 类格式噪音，改历史迁移无收益。
# 这是 CI「ruff check .」与本地「ruff check app/ tests/ scripts/ main.py」唯一范围差。
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# 别名 import 合并进同一个括号块，避免 "X as A" 被逐个拆成独立 import 语句
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认只跑单元/安全/混沌（mock 注入）；集成与负载需显式 -m 选择
# -p no:cacheprovider：关掉 pytest 的缓存插件。它在写不进 `.pytest_cache` 时会退回到
# 工作目录拉一个 `pytest-cache-files-*` 临时目录（本机沙箱里建得出来、删不掉），
# 每跑一次 pytest 就留一个空目录 + 一条 PytestCacheWarning。缓存只为 --lf 服务，
# 这里用不上，直接关掉，换来干净的测试输出和零残留。
addopts = "-m 'not integration and not load' -p no:cacheprovider"
markers = [
    "integration: 依赖真实 PG/Redis/LLM 的集成测试（需 TEST_POSTGRES_CONNECTION_STRING）",
    "load: 负载测试（脚本形式，不进默认 pytest）",
    "chaos: 故障注入测试（mock PG/Redis/LLM 异常）",
    "security: 鉴权/越权/注入/SSRF/隐私回归测试",
]
