# 先知智能体 · CI 门禁
# 对应 docs/code-review-standard.md §3（硬指标机拦）与 §8。
# 作用：把"格式/类型/单测/覆盖率"从人工盯变成自动拦截，审查人只审逻辑/设计/安全判断。
# 注意：本文件为可直接启用的起点，数据库相关测试若与你们的 TEST_DB_URL 约定不符，请微调 env。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 (ruff + pytest + cov)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # pgvector 服务：供依赖 PostgreSQL/pgvector 的测试使用。
    services:
      pg:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xianzhi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 注意：项目约束 requires-python ">=3.11,<3.13"，勿升到 3.13。

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          # dev 工具（pytest/ruff/pytest-asyncio）在 pyproject optional，这里显式安装稳妥。
          # ruff 钉死版本：新版可能新增规则导致 CI 意外变红（>=0.7.0 浮动装曾踩过）。
          pip install "pytest>=8.0.0" "pytest-asyncio>=0.24.0" "ruff==0.16.3" "pytest-cov"

      - name: Ruff 检查（硬指标：零错误）
        run: ruff check .
        # 范围=整个 backend/；migrations 已在 pyproject [tool.ruff] extend-exclude 排除。

      - name: 运行测试 + 覆盖率门禁
        run: |
          # 与本地门禁同口径：排除 integration 标记（test_api_integration 需完整应用栈，
          # 未初始化时自跳过，显式排除更稳）。测试零真实 DB 连接（pool 全打桩），
          # pgvector 服务留作未来接入真实 DB 测试。
          # 整体覆盖率硬门槛 60%（§3.6）。
          pytest -q -m "not integration" --cov=app --cov-report=term-missing --cov-fail-under=60

  frontend:
    name: 前端 (vue-tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: 类型检查（硬指标：零错误，strict）
        run: npm run build
        # 注：当前 package.json 仅有 dev/build/preview，无独立 lint 脚本。
        # 如需 ESLint/Prettier，待补充配置后在此追加一步。

  uniapp:
    name: 小程序 (vue-tsc --noEmit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/uniapp
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/uniapp/package-lock.json

      - name: 安装依赖
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: 类型检查（硬指标：零错误）
        run: npm run type-check
        # 必须走 package.json 里的 `vue-tsc --noEmit`，不要照搬 web 的 `-b`：
        # ① `-b` 检查不到 pages/*.vue —— 曾因此把「有 1 个 TS 错误」误报成 0 错误；
        # ② `-b` 会把 .js / .js.map emit 回 src/ 与 shared/，污染源码目录
        #    （已在 uniapp/tsconfig.json 补 noEmit 兜住，这里是第二道）。
