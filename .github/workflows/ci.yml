name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest ruff
      - name: Ruff
        run: ruff check app tests scripts/check_pip_audit.py main.py
      - name: Unit / security / chaos tests
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pip-audit
        run: python -m pip install "pip-audit>=2.7,<3"
      - name: Backend dependency audit
        working-directory: backend
        run: |
          # pip-audit 本身对发现项返回非 0；交给豁免清单脚本判定是否放行
          python -m pip_audit -r requirements.lock -f json -o /tmp/pip-audit.json || true
          python scripts/check_pip_audit.py --audit-json /tmp/pip-audit.json
      - name: Web dependency audit (production)
        working-directory: frontend/web
        run: |
          npm audit --package-lock-only --json > /tmp/web-audit.json || true
          node scripts/check_npm_audit.mjs /tmp/web-audit.json
      - name: Uniapp dependency audit (informational, not launched)
        continue-on-error: true
        working-directory: frontend/uniapp
        run: |
          npm audit --omit=dev --package-lock-only --json > /tmp/uniapp-audit.json || true
          node -e "const r=require('/tmp/uniapp-audit.json'); console.log('uniapp prod:', JSON.stringify(r.metadata && r.metadata.vulnerabilities))"

  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xianzhi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_POSTGRES_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/xianzhi_test
      POSTGRES_CONNECTION_STRING: postgresql://postgres:postgres@localhost:5432/xianzhi_test
      TEST_REDIS_URL: redis://localhost:6379/0
      REDIS_URL: redis://localhost:6379/0
      MEMORY_STORE_TYPE: postgres
      VECTOR_STORE_TYPE: postgres
      RAG_INIT_ENABLED: "false"
      DASHSCOPE_BASE_URL: http://127.0.0.1:9000/v1
      DASHSCOPE_API_KEY: test
      DASHSCOPE_MODEL: mock-model
      DECOMPOSE_MODEL: mock-model
      REVIEWER_MODEL: mock-model
      SUB_APP_MODEL: mock-model
      LLM_ENABLE_THINKING: "false"
      APP_ENV: dev
      API_KEYS: ci-admin-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest ruff
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Start mock LLM
        run: |
          nohup python scripts/mock_llm_server.py > /tmp/mock-llm.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/health && break
            sleep 1
          done
      - name: Integration tests
        run: pytest -m integration -q
